name: CDECK CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: JavaScript tests
        run: node --test tests/test_cdeck_js.mjs

      - name: Diff integrity
        run: git diff --check

      - name: Production LOC ceiling
        run: |
          total=$(( $(wc -l < cdeck.py) + $(wc -l < cdeck.js) ))
          echo "Production LOC: $total"
          test "$total" -le 1000
